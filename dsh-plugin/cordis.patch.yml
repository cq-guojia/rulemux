# rulemux: deliver a workspace's rules to a dsh session — the plugin asks the rulemux CLI for them
# (`rulemux inject --agent dsh`) and injects that text, so nothing is written into the workspace.
#
# Installed through the normal dsh plugin route — `dsh plugin --profile <name> add rulemux-dsh`
# (from npm, a local .tgz, or git). Because package.json declares `dsh.bundle.patch`, that command
# appends this file to the profile's ordered bundle list; nothing else needs editing. The row below
# mounts on the host plane, where agent/session-start and agent/pre-step reach every session.
#
# `name` is a bare package specifier, resolved from the profile's node_modules (see dsh's own
# plugins). To disable it without uninstalling, patch this row in the profile's cordis.patch.yml:
#
#   - id: rulemux
#     disabled: true
- insert:
    - id: rulemux
      name: "rulemux-dsh"
