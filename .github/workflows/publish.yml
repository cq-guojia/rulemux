# Publish pipeline: push a tag (vX.Y.Z) -> cross-compile all platform binaries ->
# attach them to a GitHub Release -> publish the npm package.
#
# npm publishing uses GitHub OIDC trusted publishing (no long-lived NPM_TOKEN):
# the `npm` job gets `permissions: id-token: write` and npm exchanges the
# short-lived GitHub OIDC token for a publish grant. Configure the Trusted
# Publisher for `rulemux` on npmjs.com -> Settings -> Trusted Publishers,
# pointing at this `publish.yml` workflow in cq-guojia/rulemux. `--provenance`
# attaches a signed supply-chain attestation.
#
# Usage (maintainers):
#   npm version patch|minor|major     # bumps package.json + creates git tag v0.x.y
#   git push --follow-tags            # triggers this pipeline (incl. npm publish)
name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="rulemux-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then name="$name.exe"; fi
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "$name" .
          echo "built $name"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rulemux-${{ matrix.goos }}-${{ matrix.goarch }}
          path: rulemux-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh infers the repo from the git remote; GH_REPO makes it explicit.
          GH_REPO: ${{ github.repository }}
        run: |
          chmod +x dist/rulemux-* 2>/dev/null || true
          # Idempotent: a previous run may have already created the release
          # (e.g. an old npm job failure); upload/clobber its assets instead.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              dist/*
          fi

  npm:
    needs: release
    runs-on: ubuntu-latest
    # id-token: write lets the workflow request a short-lived OIDC token from
    # GitHub; npm exchanges it for a publish grant. No NPM_TOKEN secret needed.
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing (no token) requires npm >= 11.5.0; older npm
      # falls back to an unauthenticated PUT which the registry answers E404.
      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@^11

      - name: Build bundled binaries (version taken from the tag)
        run: bash scripts/build-dist.sh "${GITHUB_REF_NAME#v}"

      - name: Sync package.json version to the tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Publish to npm via OIDC (no token)
        run: npm publish --provenance --access public
